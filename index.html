<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S2U</title>
<style>
:root{--bg:#f4fafe;--card:#fff;--ink:#14293b;--sub:#6b8296;--line:#dcebf5;--sky:#4fb8f0;--sky2:#d6eefc;--pink:#ff9ec1;--pinkbg:#ffe6ef;--her:#e9eef2;--meink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b26;--card:#182a39;--ink:#eaf5fd;--sub:#93aec2;--line:#27405a;--sky2:#1d3b52;--pinkbg:#3b2431;--her:#233648;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b26;--card:#182a39;--ink:#eaf5fd;--sub:#93aec2;--line:#27405a;--sky2:#1d3b52;--pinkbg:#3b2431;--her:#233648;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--sky2);color:var(--ink);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:520px){.phone{width:390px;height:min(844px,calc(100% - 32px));border-radius:52px;border:9px solid #1b1d20;box-shadow:0 24px 60px #14293b44;isolation:isolate}.screen,#viewer,#dexm,#giftm{border-radius:43px}.screen{overflow:hidden}}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:700;font-size:15px;z-index:20;pointer-events:none;color:var(--ink)}
.phone.lk .sb{color:#14293b}
.isl{position:absolute;left:50%;top:10px;width:104px;height:28px;margin-left:-52px;border-radius:20px;background:#000;z-index:21}
.hi{position:absolute;bottom:8px;left:50%;width:128px;height:5px;margin-left:-64px;border-radius:9px;background:var(--ink);opacity:.8;z-index:20;pointer-events:none}
.phone.lk .hi{background:#14293b;pointer-events:auto;cursor:pointer}
.hi::after{content:"";position:absolute;left:-60px;right:-60px;top:-48px;bottom:-8px}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* setup */
#setup{padding:70px 24px 28px;overflow-y:auto}
.logo{font-weight:800;letter-spacing:.2em;font-size:14px;color:var(--sky)}
h1{font-size:28px;margin:6px 0 6px}
.d{color:var(--sub);margin:0 0 8px;font-size:15px;line-height:1.5}
h2{font-size:13px;color:var(--sub);margin:22px 0 4px;font-weight:600}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
input,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible,#lock:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hint{margin-top:16px;font-size:14px;background:var(--pinkbg);padding:10px 14px;border-radius:12px;min-height:40px}
.btn{margin-top:auto;font:inherit;font-weight:700;font-size:17px;padding:15px;border:0;border-radius:16px;background:var(--sky);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sp{height:24px;flex:none}
.cancel{margin-top:10px;font:inherit;border:0;background:none;color:var(--sub);padding:10px;cursor:pointer}
/* lock */
#lock{background:radial-gradient(circle at 80% 88%,#ffd3e3 0,#ffd3e300 45%),linear-gradient(175deg,#6cc3f3 0,#b9e3fa 55%,#f3fbff 100%);color:#14293b;align-items:center;user-select:none;transition:transform .35s ease;padding-top:92px}
#lock .dt{font-size:19px;font-weight:600}
#lock .t{font-size:92px;font-weight:700;line-height:1.02;letter-spacing:-.02em}
.nt{margin:34px 14px 0;align-self:stretch;background:#ffffffb8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;box-shadow:0 4px 16px #14293b1a}
.ai{flex:none;width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--sky),#8fd6fb);display:grid;place-items:center;font-size:20px}
.nt .r{flex:1;min-width:0}.nt .h{display:flex;justify-content:space-between;font-size:12px;color:#4a6478}
.nt b{display:block;font-size:15px;margin-top:1px}
.nt .bd{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.up{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:14px;color:#2d4a60}
/* chat */
#chat{background:var(--bg)}
.hd{padding:52px 12px 8px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between}
.hd .c{text-align:center;flex:1}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 3px;background-size:145%;background-position:50% 22%;border:2px solid var(--pink);background-color:var(--sky2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.hd small{font-size:12px;color:var(--sub)}
.ib{border:0;background:none;color:var(--sky);font-size:22px;padding:8px;cursor:pointer;width:44px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.sn{align-self:flex-start;font-size:11px;color:var(--sub);margin:6px 0 -3px 10px}
.m{max-width:76%;padding:9px 14px;border-radius:19px;line-height:1.4;font-size:16px;overflow-wrap:anywhere}
.m.her{align-self:flex-start;background:var(--her)}
.m.me{align-self:flex-end;background:var(--sky);color:var(--meink)}
.in{display:flex;gap:8px;align-items:center;padding:8px 12px 26px;background:var(--bg)}
.in input{flex:1;border-radius:20px;padding:9px 14px;font-size:16px}
.send{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.m.pic{padding:4px;background:var(--card);border:1px solid var(--line);max-width:68%}
.m.pic img{display:block;width:100%;border-radius:15px;cursor:zoom-in}
#viewer{position:absolute;inset:0;z-index:30;background:#0b1620ee;overflow:auto;display:none;padding:56px 10px 30px;text-align:center}
#viewer.on{display:block}
#viewer img{width:100%;border-radius:14px}
#vclose{position:sticky;top:0;display:block;margin:-46px 0 10px auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:16px;cursor:pointer;z-index:2}
.dd{margin-top:14px;background:#ffffffb8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;padding:10px 18px;text-align:center;box-shadow:0 4px 16px #14293b14;border:1.5px solid #ffc2d8;color:#14293b}
.dd b{display:block;font-size:17px;color:#e0507f}.dd small{font-size:12px;color:#4a6478}
.dexb{width:64px;border:0;background:var(--pinkbg);color:var(--ink);font:inherit;font-size:13px;font-weight:600;border-radius:14px;padding:7px 4px;margin-top:6px;cursor:pointer}
.ib{width:64px}
#toast{position:absolute;top:104px;left:50%;transform:translate(-50%,-10px);background:var(--pink);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:99px;z-index:25;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dexm{position:absolute;inset:0;z-index:30;background:#0b162099;display:none;align-items:center;justify-content:center;padding:24px}
#dexm.on{display:flex}
#dexm .card{position:relative;background:var(--card);border-radius:24px;padding:24px 20px 18px;width:100%;max-height:80%;overflow:auto;text-align:center}
#dexm h3{margin:0 0 4px;font-size:20px}#dprog{margin:0 0 14px;color:#e0507f;font-weight:700}
#dlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 12px;border-radius:99px;font-size:14px;background:var(--sky2);color:var(--ink)}
.chip.no{background:var(--her);color:var(--sub);letter-spacing:.1em}
.dn{font-size:12px;color:var(--sub);margin:16px 0 0}
#dclose{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:var(--pinkbg);color:var(--ink);cursor:pointer}
#giftm{position:absolute;inset:0;z-index:35;background:linear-gradient(170deg,#bfe6fb,#ffe3ee);display:none;overflow:auto;padding:64px 18px 40px}
#giftm.on{display:block;animation:gf .5s ease}
@keyframes gf{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.gcard{position:relative;text-align:center}
.gt{font-weight:800;font-size:22px;letter-spacing:.06em;color:#e0507f;line-height:1.3;margin:0 0 14px;text-shadow:0 2px 0 #fff}
#gimg{width:100%;border-radius:22px;border:5px solid #fff;box-shadow:0 10px 30px #14293b33;display:block}
.gn{color:#2d4a60;font-size:14px;margin:14px 0 0}
#gclose{position:fixed;position:sticky;top:0;display:block;margin:-50px 0 14px auto;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#14293b;font-size:16px;cursor:pointer;z-index:2}
.dgift{margin-top:14px;border:0;background:var(--pink);color:#fff;font:inherit;font-weight:700;border-radius:14px;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="phone" id="ph">
<div class="isl"></div>
<div class="sb"><span id="sbt">9:41</span><span>5G ▮▮▮</span></div>
<div class="hi" id="hi" role="button" tabindex="0" aria-label="잠금 해제"></div>

<section class="screen" id="setup">
  <div class="logo">S2U</div>
  <h1 id="stt">처음 오셨네요</h1>
  <p class="d">이름과 출생 연도를 알려주세요.</p>
  <label for="nm">내 이름</label>
  <input id="nm" maxlength="12" placeholder="예: 하츄" autocomplete="off">
  <label for="yr">출생 연도</label>
  <select id="yr"><option value="">출생 연도 선택</option></select>
  <h2>주은이 이름 (선택)</h2>
  <input id="jn" maxlength="12" placeholder="주은" autocomplete="off" aria-label="주은이 이름">
  <div class="hint" id="hint"></div>
  <div class="sp"></div>
  <button class="btn" id="go" disabled>S2U 시작하기</button>
  <button class="cancel" id="cancel" hidden>취소</button>
</section>

<section class="screen" id="lock" aria-label="잠금 화면">
  <div class="dt" id="dt"></div>
  <div class="t" id="t">9:41</div>
  <div class="nt">
    <div class="ai">💬</div>
    <div class="r"><div class="h"><span>JUUN EMOJI</span><span>지금</span></div><b id="nsn"></b><div class="bd" id="nbd"></div></div>
  </div>
  <div class="dd"><b id="ddt"></b><small>12.03 12:00~19:00 · 카페 DALDAGURI</small></div>
  <div class="up">아래 바를 눌러 잠금 해제</div>
</section>

<section class="screen" id="chat">
  <div class="hd">
    <button class="dexb" id="dex" aria-label="키워드 도감">📖 0/0</button>
    <div class="c"><div class="av" id="av"></div><small id="room"></small></div>
    <button class="ib" id="edit" aria-label="설정">⚙︎</button>
  </div>
  <div id="msgs" aria-live="polite"></div>
  <div class="in"><input id="txt" placeholder="JUUN EMOJI" autocomplete="off" aria-label="메시지 입력"><button class="send" id="send" aria-label="보내기">↑</button></div>
</section>
<div id="toast" role="status"></div>
<div id="dexm" role="dialog" aria-label="키워드 도감"><div class="card"><button id="dclose" aria-label="닫기">✕</button><h3>키워드 도감</h3><p id="dprog"></p><div id="dlist"></div><button class="dgift" id="dgift" style="display:none">🎁 A SECRET GIFT 다시 보기</button><p class="dn" id="dnote">주은이에게 말을 걸어 키워드를 찾아보세요!</p></div></div>
<div id="giftm" role="dialog" aria-label="시크릿 선물"><div class="gcard"><button id="gclose" aria-label="닫기">✕</button><div class="gt">A SECRET GIFT<br>FOR YOU ♡</div><img id="gimg" alt="시크릿 선물 사진"><p class="gn">키워드를 모두 찾아줘서 고마워요 💕</p></div></div>
<div id="viewer" role="dialog" aria-label="생카 공지 이미지"><button id="vclose" aria-label="닫기">✕</button><img id="vimg" alt="생카 공지 이미지"></div>
</div>

function START(){var n=who();return n+"~💕 말랑콩떡 주은입니당! 앞으로도 "+n+"의 하루하루가 행복하구 사랑만으로 가득 찰 수 있도록 노력할게요! 감사합니당👾❤️"}
var KW=[["사랑해","고랑해~ 고마워 사랑해 🦍"],["성수","내가 지금 성수가면 될까..?"],["보고싶어","안아주고싶다"],["스무살","그냥 계속 어화둥둥해주라"],["입덕","삶은 하투하를 알기 전과 후로 나뉜다"],["김주은","성 빼"],["우주즈","둘이 잘어울린다"],["생카",null,"NOTICE"],["안녕","{이름} 안뇨옹"],["하멍쭈멍","유하언니랑 요즘 코레오 너무 추고싶다!"],["팥빵즈","내년에 스무살."],["햄빵즈","뽀짝이…"],["칼국쭈","르멘핑!"],["쭈텔라","귀엽죵?"],["쭈잉껌","쭈잉쭈잉"],["바보","바부라니.."],["귀여워","내 이름이 귀여워인가…"],["하츄","내 사랑"],["주은아","왜왱"],["반했어","아잉><"]];
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY)||localStorage.getItem("hachuPhoneUser");return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function show(id){["setup","lock","chat"].forEach(function(s){$(s).classList.toggle("on",s===id)});$("ph").classList.toggle("lk",id==="lock")}
function jname(){return(st&&st.jname&&st.jname.trim())||DEF}
function room(){return jname()===DEF?"JUUN":jname()}
/* 호칭: 연상 = 언니 / 동갑·연하 = 이름 + 아(야) */
function call(u){
  if(u.year<BASE)return"언니";
  var n=u.name,c=n.charCodeAt(n.length-1);
  return n+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28===0)?"야":"아");
}
function kind(y){return y<BASE?"연상":y===BASE?"동갑":"연하"}
/* 답장 문구에 {호칭}이 있을 때만 호칭 반영 (현재 기존 답장에는 없음) */
function fill(t){return t.replace(/\{호칭\}/g,call(st)).replace(/\{이름\}/g,who())}

/* setup */
var sel=$("yr");
for(var y=new Date().getFullYear();y>=1950;y--){var o=document.createElement("option");o.value=y;o.textContent=y+"년";sel.appendChild(o)}
function check(){
  var n=$("nm").value.trim(),y=sel.value;
  $("go").disabled=!(n&&y);
  $("hint").textContent=(n&&y)?"주은이는 “"+call({name:n,year:+y})+"”라고 불러요 ("+kind(+y)+")":"이름과 출생 연도를 입력하면 호칭이 표시돼요.";
}
["input","change"].forEach(function(e){$("nm").addEventListener(e,check);sel.addEventListener(e,check)});
$("go").onclick=function(){
  st={name:$("nm").value.trim(),year:+sel.value,jname:$("jn").value.trim()||DEF};save();
  if(editing){editing=false;fillChat();show("chat")}else toLock();
};
$("edit").onclick=function(){
  editing=true;$("nm").value=st.name;sel.value=st.year;$("jn").value=jname()===DEF?"":jname();
  $("stt").textContent="설정";$("go").textContent="저장하기";$("cancel").hidden=false;check();show("setup");
};
$("cancel").onclick=function(){editing=false;show("chat")};

/* clock */
function tick(){
  var d=new Date(),p=function(n){return n<10?"0"+n:n},h=d.getHours()%12||12;
  var s=h+":"+p(d.getMinutes());
  $("t").textContent=s;$("sbt").textContent=s;
  $("dt").textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 "+"일월화수목금토"[d.getDay()]+"요일";
}
setInterval(tick,10000);

/* lock */
function toLock(){
  tick();dday();$("nsn").textContent=jname();$("nbd").textContent=START();
  $("lock").style.transition="none";$("lock").style.transform="";show("lock");
}
var lk=$("lock"),opening=false;
function unlock(){
  if(opening||!$("ph").classList.contains("lk"))return;
  opening=true;lk.style.transition="";lk.style.transform="translateY(-100%)";
  setTimeout(function(){opening=false;enterChat()},300);
}
$("hi").onclick=unlock;
$("hi").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();unlock()}});

/* chat */
function fillChat(){
  $("room").textContent=room();
  $("av").textContent="";$("av").style.backgroundImage="url("+PFP+")";
  var s=document.querySelectorAll(".sn");for(var i=0;i<s.length;i++)s[i].textContent=jname();
}
function imgBubble(src){
  var box=$("msgs"),n=document.createElement("div");n.className="sn";n.textContent=jname();box.appendChild(n);
  var d=document.createElement("div");d.className="m her pic";
  var i=document.createElement("img");i.src=src;i.alt="생카 공지 이미지";i.onclick=function(){openImg(src)};
  d.appendChild(i);box.appendChild(d);
  i.onload=function(){box.scrollTop=box.scrollHeight};box.scrollTop=box.scrollHeight;
}
function openImg(src){$("vimg").src=src;$("viewer").classList.add("on");$("viewer").scrollTop=0}
function bubble(t,who){
  var box=$("msgs");
  if(who==="her"){var n=document.createElement("div");n.className="sn";n.textContent=jname();box.appendChild(n)}
  var d=document.createElement("div");d.className="m "+who;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function enterChat(){
  $("msgs").innerHTML="";fillChat();show("chat");
  setTimeout(function(){bubble(START(),"her")},350);
}
function send(){
  var t=$("txt").value.trim();if(!t)return;
  $("txt").value="";bubble(t,"me");
  var flat=t.replace(/\s+/g,""),hits=[];
  KW.forEach(function(k){var i=flat.indexOf(k[0]);if(i>=0)hits.push({i:i,r:k[1],img:k[2],k:k[0]})});
  hits.sort(function(a,b){return a.i-b.i});
  hits.forEach(function(h,n){setTimeout(function(){if(h.img)imgBubble(NOTICE);else bubble(fill(h.r),"her");markFound(h.k)},650*(n+1))});
}
$("send").onclick=send;
$("vclose").onclick=function(){$("viewer").classList.remove("on")};
$("viewer").addEventListener("click",function(e){if(e.target.id==="viewer")$("viewer").classList.remove("on")});
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing)send()});

/* 키워드 도감 */
var FKEY="s2uFound",found=[],tt=null;
try{var fr=JSON.parse(localStorage.getItem(FKEY)||"[]");found=fr.filter(function(k){return KW.some(function(x){return x[0]===k})})}catch(e){}
function updateDex(){$("dex").textContent="📖 "+found.length+"/"+KW.length}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2200)}
function markFound(k){
  if(found.indexOf(k)>=0)return;
  found.push(k);try{localStorage.setItem(FKEY,JSON.stringify(found))}catch(e){}
  updateDex();
  if(found.length===KW.length){toast("🎉 도감 완성!");setTimeout(openGift,1100)}
  else toast("새 키워드 발견! "+found.length+"/"+KW.length);
}
function openDex(){
  $("dprog").textContent="찾은 키워드 "+found.length+" / "+KW.length;
  var l=$("dlist");l.innerHTML="";
  KW.forEach(function(x){var c=document.createElement("span"),f=found.indexOf(x[0])>=0;c.className="chip"+(f?"":" no");c.textContent=f?x[0]:"???";l.appendChild(c)});
  var done=found.length===KW.length;
  $("dgift").style.display=done?"":"none";
  $("dnote").textContent=done?"도감 완성! 🎉":"주은이에게 말을 걸어 키워드를 찾아보세요!";
  $("dexm").classList.add("on");
}
function openGift(){
  $("dexm").classList.remove("on");
  $("gimg").src=GIFT;$("giftm").classList.add("on");$("giftm").scrollTop=0;
}
$("dgift").onclick=openGift;
$("gclose").onclick=function(){$("giftm").classList.remove("on")};
$("dex").onclick=openDex;
$("dclose").onclick=function(){$("dexm").classList.remove("on")};
$("dexm").addEventListener("click",function(e){if(e.target.id==="dexm")$("dexm").classList.remove("on")});
/* D-DAY: 2026-12-03 생일 카페 */
function dday(){
  var d=new Date(),t=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=Math.round((new Date(2026,11,3)-t)/864e5);
  var box=document.querySelector(".dd");
  if(n<0){box.style.display="none";return}
  box.style.display="";
  $("ddt").textContent="🎂 JUUN 생일 카페 "+(n===0?"D-DAY":"D-"+n);
}
/* boot */
updateDex();
tick();
st=load();
if(st&&st.name&&st.year)toLock();else{st=null;check();show("setup")}
</script>
